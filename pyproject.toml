[project]
name = "uv-project-template"
version = "0.1.0"
description = "A Python project template managed with uv"
authors = [
    {name = "Cvandia", email = "106718176+Cvandia@users.noreply.github.com"},
]
dependencies = []
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = {text = "MIT"}


[dependency-groups]
dev = ["pre-commit>=4.0.1", "ruff>=0.8.1", "pytest>=8.3.4"]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
